name: CI
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 语法检查全部脚本（零依赖）
        run: python -m py_compile env_setup.py src/*.py scripts/*.py configs/*.py && echo SYNTAX_OK
      - name: 数据完整性（关键 jsonl 可解析）
        run: python -c "
import json, glob
n = 0
for f in glob.glob('results/*.jsonl'):
    for line in open(f, encoding='utf-8'):
        json.loads(line); n += 1
print(f'DATA_OK {n} records')"
